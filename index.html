<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coin Toss Game</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #f9d423, #ff4e50);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle { color: #aaa; margin-bottom: 24px; font-size: 0.9rem; }

    /* Status bar */
    .status-bar {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 20px;
    }
    .stat {
      text-align: center;
      background: rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 12px 20px;
      min-width: 110px;
    }
    .stat-label { font-size: 0.75rem; text-transform: uppercase; color: #999; }
    .stat-value { font-size: 1.5rem; font-weight: 700; margin-top: 4px; }
    .stat-value.money { color: #f9d423; }
    .stat-value.streak { color: #4fc3f7; }
    .stat-value.chance { color: #81c784; }
    .stat-value.tosses { color: #ce93d8; }

    /* Streak meter */
    .streak-meter {
      width: 100%;
      max-width: 500px;
      height: 28px;
      background: rgba(255,255,255,0.08);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 24px;
      position: relative;
    }
    .streak-fill {
      height: 100%;
      background: linear-gradient(90deg, #4fc3f7, #0288d1);
      border-radius: 14px;
      transition: width 0.3s ease;
    }
    .streak-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 600;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }

    /* Coin */
    .coin-area { margin-bottom: 24px; }
    .coin {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s, box-shadow 0.15s;
      border: 4px solid rgba(255,255,255,0.15);
    }
    .coin:hover { transform: scale(1.06); }
    .coin:active { transform: scale(0.95); }
    .coin.idle {
      background: radial-gradient(circle at 35% 35%, #f9d423, #c49b12);
      color: #3e2e00;
      box-shadow: 0 4px 20px rgba(249,212,35,0.4);
    }
    .coin.heads {
      background: radial-gradient(circle at 35% 35%, #4fc3f7, #0288d1);
      color: #fff;
      box-shadow: 0 4px 20px rgba(79,195,247,0.5);
      animation: popIn 0.3s ease;
    }
    .coin.tails {
      background: radial-gradient(circle at 35% 35%, #ef5350, #b71c1c);
      color: #fff;
      box-shadow: 0 4px 20px rgba(239,83,80,0.5);
      animation: popIn 0.3s ease;
    }
    .coin.won {
      background: radial-gradient(circle at 35% 35%, #66bb6a, #2e7d32);
      color: #fff;
      box-shadow: 0 4px 30px rgba(102,187,106,0.6);
      animation: pulse 1s ease infinite;
    }
    @keyframes popIn { 0% { transform: scale(0.7); } 60% { transform: scale(1.1); } 100% { transform: scale(1); } }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }

    .result-text {
      margin-top: 10px;
      font-size: 1rem;
      min-height: 24px;
      text-align: center;
    }

    /* Sections container */
    .sections {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      width: 100%;
      max-width: 800px;
    }
    @media (max-width: 640px) { .sections { grid-template-columns: 1fr; } }

    .panel {
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 16px;
    }
    .panel h2 {
      font-size: 1rem;
      margin-bottom: 12px;
      color: #ccc;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 8px;
    }

    /* Upgrades */
    .upgrade-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .upgrade-info .upgrade-name { font-weight: 600; font-size: 0.9rem; }
    .upgrade-info .upgrade-desc { font-size: 0.75rem; color: #999; }
    .upgrade-info .upgrade-owned { font-size: 0.7rem; color: #4fc3f7; }
    .buy-btn {
      background: linear-gradient(135deg, #f9d423, #e8a500);
      color: #1a1a2e;
      border: none;
      border-radius: 8px;
      padding: 6px 14px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .buy-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .buy-btn:not(:disabled):hover { opacity: 0.85; }

    /* History */
    .history-panel { grid-column: 1 / -1; }
    .history-list {
      max-height: 250px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 0.78rem;
      line-height: 1.6;
    }
    .history-list::-webkit-scrollbar { width: 6px; }
    .history-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
    .h-heads { color: #4fc3f7; }
    .h-tails { color: #ef5350; }
    .h-upgrade { color: #f9d423; }
    .h-win { color: #66bb6a; font-weight: 700; }

    /* Win overlay */
    .win-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .win-overlay.show { display: flex; }
    .win-box {
      background: linear-gradient(135deg, #1a1a2e, #302b63);
      border: 2px solid #66bb6a;
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      max-width: 400px;
    }
    .win-box h2 { font-size: 2rem; color: #66bb6a; margin-bottom: 12px; }
    .win-box p { margin-bottom: 8px; color: #ccc; }
    .win-box .big-stat { font-size: 1.5rem; font-weight: 700; color: #f9d423; }
    .restart-btn {
      margin-top: 20px;
      background: linear-gradient(135deg, #66bb6a, #2e7d32);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 32px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .restart-btn:hover { opacity: 0.9; }
  </style>
</head>
<body>

<h1>🪙 Coin Toss Game</h1>
<p class="subtitle">Get 10 consecutive heads to win — but the odds are against you (10% heads)</p>

<!-- Status Bar -->
<div class="status-bar">
  <div class="stat"><div class="stat-label">Money</div><div class="stat-value money" id="money">$0</div></div>
  <div class="stat"><div class="stat-label">Streak</div><div class="stat-value streak" id="streak">0</div></div>
  <div class="stat"><div class="stat-label">Head Chance</div><div class="stat-value chance" id="chance">10.0%</div></div>
  <div class="stat"><div class="stat-label">Tosses</div><div class="stat-value tosses" id="tosses">0</div></div>
</div>

<!-- Streak Meter -->
<div class="streak-meter">
  <div class="streak-fill" id="streakFill" style="width: 0%"></div>
  <div class="streak-text" id="streakText">0 / 10 consecutive heads</div>
</div>

<!-- Coin -->
<div class="coin-area">
  <div class="coin idle" id="coin" onclick="doToss()">TOSS</div>
  <div class="result-text" id="resultText">Click the coin to toss!</div>
</div>

<!-- Upgrades & History -->
<div class="sections">
  <div class="panel">
    <h2>🛒 Upgrades</h2>
    <div id="upgradeList"></div>
  </div>
  <div class="panel">
    <h2>📊 Stats</h2>
    <div id="statsPanel" style="font-size:0.85rem; line-height:1.8;"></div>
  </div>
  <div class="panel history-panel">
    <h2>📜 History</h2>
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<!-- Win Overlay -->
<div class="win-overlay" id="winOverlay">
  <div class="win-box">
    <h2>🎉 YOU WIN!</h2>
    <p>10 Consecutive Heads!</p>
    <p>Total tosses: <span class="big-stat" id="winTosses"></span></p>
    <p>Final balance: <span class="big-stat" id="winMoney"></span></p>
    <button class="restart-btn" onclick="restartGame()">Play Again</button>
  </div>
</div>

<script src="game.js"></script>
<script>
  let game = createGame();

  function render() {
    // Stats
    document.getElementById('money').textContent = '$' + game.money;
    document.getElementById('streak').textContent = game.consecutiveHeads;
    document.getElementById('chance').textContent = (getEffectiveHeadChance(game) * 100).toFixed(1) + '%';
    document.getElementById('tosses').textContent = game.totalTosses;

    // Streak meter
    const pct = (game.consecutiveHeads / 10) * 100;
    document.getElementById('streakFill').style.width = pct + '%';
    document.getElementById('streakText').textContent = game.consecutiveHeads + ' / 10 consecutive heads';

    // Upgrades
    const upgrades = getAvailableUpgrades(game);
    const ul = document.getElementById('upgradeList');
    ul.innerHTML = upgrades.map(u => `
      <div class="upgrade-item">
        <div class="upgrade-info">
          <div class="upgrade-name">${u.name}</div>
          <div class="upgrade-desc">${u.description} — $${u.cost}</div>
          <div class="upgrade-owned">Owned: ${u.purchased}/${u.maxPurchases}</div>
        </div>
        <button class="buy-btn" onclick="doBuy('${u.id}')" ${u.canBuy ? '' : 'disabled'}>Buy</button>
      </div>
    `).join('');

    // Stats panel
    const totalHeads = game.history.filter(e => e.type === 'toss' && e.outcome === 'heads').length;
    const totalTails = game.history.filter(e => e.type === 'toss' && e.outcome === 'tails').length;
    const bestStreak = game.history.reduce((max, e) => e.type === 'toss' && e.outcome === 'heads' && e.streak > max ? e.streak : max, 0);
    const totalSpent = game.history.filter(e => e.type === 'upgrade').reduce((sum, e) => sum + e.cost, 0);
    document.getElementById('statsPanel').innerHTML = `
      <div>Total Heads: <strong>${totalHeads}</strong></div>
      <div>Total Tails: <strong>${totalTails}</strong></div>
      <div>Best Streak: <strong>${bestStreak}</strong></div>
      <div>Total Earned: <strong>$${game.money + totalSpent}</strong></div>
      <div>Total Spent: <strong>$${totalSpent}</strong></div>
    `;

    // History
    const lines = formatHistory(game);
    const hl = document.getElementById('historyList');
    hl.innerHTML = lines.map(line => {
      let cls = '';
      if (line.includes('HEADS')) cls = 'h-heads';
      else if (line.includes('TAILS')) cls = 'h-tails';
      else if (line.includes('UPGRADE')) cls = 'h-upgrade';
      else if (line.includes('WIN')) cls = 'h-win';
      return `<div class="${cls}">${line}</div>`;
    }).reverse().join('');
  }

  function doToss() {
    if (game.status === GameState.WON) return;
    tossCoin(game);

    const last = game.history[game.history.length - 1];
    const coin = document.getElementById('coin');
    const resultText = document.getElementById('resultText');

    if (game.status === GameState.WON) {
      coin.className = 'coin won';
      coin.textContent = '🏆';
      resultText.textContent = '🎉 YOU WIN! 10 consecutive heads!';
      document.getElementById('winTosses').textContent = game.totalTosses;
      document.getElementById('winMoney').textContent = '$' + game.money;
      document.getElementById('winOverlay').classList.add('show');
    } else if (last.outcome === 'heads') {
      coin.className = 'coin heads';
      coin.textContent = 'H';
      resultText.textContent = `Heads! +$${last.reward} — streak: ${game.consecutiveHeads}`;
    } else {
      coin.className = 'coin tails';
      coin.textContent = 'T';
      resultText.textContent = last.lostStreak > 0
        ? `Tails! Lost streak of ${last.lostStreak}...`
        : 'Tails!';
    }

    render();
  }

  function doBuy(upgradeId) {
    const result = buyUpgrade(game, upgradeId);
    if (!result.success) {
      alert(result.reason);
      return;
    }
    render();
  }

  function restartGame() {
    game = createGame();
    document.getElementById('winOverlay').classList.remove('show');
    const coin = document.getElementById('coin');
    coin.className = 'coin idle';
    coin.textContent = 'TOSS';
    document.getElementById('resultText').textContent = 'Click the coin to toss!';
    render();
  }

  // Keyboard shortcut: space to toss
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && game.status !== GameState.WON) {
      e.preventDefault();
      doToss();
    }
  });

  render();
</script>
</body>
</html>

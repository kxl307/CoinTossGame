<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coin Toss Game</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <h1>Coin Toss Game</h1>
    <p>Reach 10 consecutive heads to win!</p>

    <section id="status">
      <div id="streak">Streak: <span id="current-streak">0</span> / 10</div>
      <div id="best">Best: <span id="best-streak">0</span></div>
      <div id="money">Money: $<span id="money-display">0</span></div>
      <div id="odds">Odds: <span id="head-chance">10</span>% heads / <span id="tail-chance">90</span>% tails</div>
    </section>

    <section id="actions">
      <button id="toss-btn">Toss Coin</button>
    </section>

    <section id="upgrades">
      <h2>Upgrades</h2>
      <div id="upgrade-list"></div>
    </section>

    <section id="history-section">
      <h2>History</h2>
      <ol id="history-log"></ol>
    </section>

    <section id="game-over-message" hidden>
      <h2>🎉 You Win!</h2>
      <p>You reached 10 consecutive heads!</p>
    </section>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>

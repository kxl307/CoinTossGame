<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coin Toss Game</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<h1>🪙 Coin Toss Game</h1>
<p class="subtitle">Get 10 consecutive heads to win — odds start at 10%</p>

<!-- Status Bar -->
<div class="status-bar">
  <div class="stat"><div class="stat-label">Money</div><div class="stat-value money" id="balance-value">$0</div></div>
  <div class="stat"><div class="stat-label">Streak</div><div class="stat-value streak" id="streak-value">0</div></div>
  <div class="stat"><div class="stat-label">Head Chance</div><div class="stat-value chance" id="chance-value">10.0%</div></div>
  <div class="stat"><div class="stat-label">Last Reward</div><div class="stat-value money" id="reward-value">-</div></div>
</div>

<!-- Streak Meter -->
<div class="streak-meter">
  <div class="streak-fill" id="streak-fill" style="width: 0%"></div>
  <div class="streak-text" id="streak-text">0 / 10 consecutive heads</div>
</div>

<!-- Win Banner -->
<div id="win-banner"></div>

<!-- Coin Area -->
<div class="coin-area">
  <div class="outcome" id="last-outcome">Ready to toss!</div>
  <button id="toss-btn">🪙 Toss Coin</button>
  <div><button id="reset-btn">🔄 New Game</button></div>
</div>

<!-- Sections -->
<div class="sections">
  <div class="panel" id="upgrades-panel">
    <h2>🛒 Upgrades</h2>
    <div id="upgrade-list"><div class="history-empty">Earn money to unlock upgrades!</div></div>
  </div>
  <div class="panel">
    <h2>📊 Stats</h2>
    <div id="stats-panel"></div>
  </div>
  <div class="panel history-panel">
    <h2>📜 History</h2>
    <div class="history-list" id="history-list"></div>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
